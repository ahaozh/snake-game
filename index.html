<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            color: #4dff91;
            margin-bottom: 20px;
            font-size: 2.8rem;
            text-shadow: 0 0 10px rgba(77, 255, 145, 0.5);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        
        .score-container, .high-score-container {
            font-size: 1.2rem;
        }
        
        .score, .high-score {
            color: #ffcc00;
            font-weight: bold;
            font-size: 1.5rem;
        }
        
        .difficulty {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        select {
            padding: 8px 15px;
            border-radius: 8px;
            border: none;
            background: #2a2a4e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            width: 500px;
            height: 500px;
            margin: 0 auto;
            background-color: #0f3460;
            border: 3px solid #4dff91;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        
        .cell {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .snake {
            background: linear-gradient(45deg, #4dff91, #00cc66);
            border-radius: 3px;
            box-shadow: 0 0 5px #4dff91;
        }
        
        .snake-head {
            background: linear-gradient(45deg, #00ff88, #00cc66);
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .food {
            background: radial-gradient(circle, #ff4757, #ff3838);
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
            box-shadow: 0 0 10px #ff4757;
        }
        
        @keyframes pulse {
            from { transform: scale(0.9); }
            to { transform: scale(1.1); }
        }
        
        .controls {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #4d7cff, #6c5ce7);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            min-width: 150px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #restart-btn {
            background: linear-gradient(45deg, #ff9f43, #ff7f00);
        }
        
        #pause-btn {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 10;
            width: 80%;
            max-width: 400px;
        }
        
        #game-over h2 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .instructions {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .mobile-controls {
            display: none;
            margin-top: 20px;
            gap: 10px;
            flex-direction: column;
        }
        
        .mobile-row {
            display: flex;
            justify-content: center;
            gap: 60px;
        }
        
        .mobile-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
        }
        
        @media (max-width: 600px) {
            .game-board {
                width: 300px;
                height: 300px;
            }
            
            .game-container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .mobile-controls {
                display: flex;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 250px;
            }
        }
        
        @media (max-width: 350px) {
            .game-board {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇大作战</h1>
        
        <div class="game-info">
            <div class="score-container">
                当前分数: <span id="score" class="score">0</span>
            </div>
            
            <div class="difficulty">
                <span>难度:</span>
                <select id="difficulty">
                    <option value="easy">简单</option>
                    <option value="medium" selected>中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
            
            <div class="high-score-container">
                最高分: <span id="high-score" class="high-score">0</span>
            </div>
        </div>
        
        <div class="game-board" id="game-board"></div>
        
        <div class="mobile-controls" id="mobile-controls">
            <div class="mobile-row">
                <div class="mobile-btn" id="up-btn">↑</div>
            </div>
            <div class="mobile-row">
                <div class="mobile-btn" id="left-btn">←</div>
                <div class="mobile-btn" id="down-btn">↓</div>
                <div class="mobile-btn" id="right-btn">→</div>
            </div>
        </div>
        
        <div class="controls">
            <div class="buttons">
                <button id="start-btn">开始游戏</button>
                <button id="pause-btn">暂停游戏</button>
                <button id="restart-btn">重新开始</button>
            </div>
        </div>
        
        <div class="instructions">
            <p>使用键盘 <strong>方向键</strong> 或 <strong>WASD</strong> 控制蛇的移动，手机用户可使用屏幕上的方向按钮。</p>
            <p>吃到红色食物得分，撞到墙壁或自己的身体游戏结束。</p>
        </div>
    </div>
    
    <div id="game-over">
        <h2>游戏结束!</h2>
        <p>你的最终分数: <span id="final-score">0</span></p>
        <p>最高分: <span id="final-high-score">0</span></p>
        <button id="play-again-btn" style="margin-top: 20px;">再玩一次</button>
    </div>

    <script>
        // 游戏配置
        const config = {
            boardSize: 20,
            cellSize: 25,
            initialSpeed: 150,
            easySpeed: 200,
            mediumSpeed: 150,
            hardSpeed: 100
        };

        // 游戏状态
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameInterval;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let isPaused = false;
        let isGameRunning = false;
        let currentSpeed = config.mediumSpeed;

        // DOM 元素
        const gameBoard = document.getElementById('game-board');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const finalScoreElement = document.getElementById('final-score');
        const finalHighScoreElement = document.getElementById('final-high-score');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');
        const playAgainBtn = document.getElementById('play-again-btn');
        const gameOverScreen = document.getElementById('game-over');
        const difficultySelect = document.getElementById('difficulty');
        const mobileControls = document.getElementById('mobile-controls');

        // 初始化游戏板
        function initBoard() {
            gameBoard.innerHTML = '';
            gameBoard.style.gridTemplateColumns = `repeat(${config.boardSize}, 1fr)`;
            gameBoard.style.gridTemplateRows = `repeat(${config.boardSize}, 1fr)`;
            
            for (let i = 0; i < config.boardSize * config.boardSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                gameBoard.appendChild(cell);
            }
        }

        // 初始化游戏
        function initGame() {
            // 初始化蛇 - 从中间开始，长度为3
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            updateScore();
            
            // 生成食物
            generateFood();
            
            // 绘制初始状态
            drawSnake();
            drawFood();
            
            // 显示手机控制按钮（如果是移动设备）
            if (window.innerWidth <= 600) {
                mobileControls.style.display = 'flex';
            } else {
                mobileControls.style.display = 'none';
            }
        }

        // 绘制蛇
        function drawSnake() {
            // 清除之前的蛇
            document.querySelectorAll('.snake, .snake-head').forEach(cell => {
                cell.classList.remove('snake', 'snake-head');
            });
            
            // 绘制新的蛇
            snake.forEach((segment, index) => {
                const cellIndex = segment.y * config.boardSize + segment.x;
                const cell = document.getElementById(`cell-${cellIndex}`);
                
                if (cell) {
                    if (index === 0) {
                        cell.classList.add('snake-head');
                    } else {
                        cell.classList.add('snake');
                    }
                }
            });
        }

        // 绘制食物
        function drawFood() {
            // 清除之前的食物
            document.querySelectorAll('.food').forEach(cell => {
                cell.classList.remove('food');
            });
            
            // 绘制新食物
            const cellIndex = food.y * config.boardSize + food.x;
            const cell = document.getElementById(`cell-${cellIndex}`);
            if (cell) {
                cell.classList.add('food');
            }
        }

        // 生成食物
        function generateFood() {
            let newFood;
            let isOnSnake;
            
            do {
                newFood = {
                    x: Math.floor(Math.random() * config.boardSize),
                    y: Math.floor(Math.random() * config.boardSize)
                };
                
                isOnSnake = snake.some(segment => 
                    segment.x === newFood.x && segment.y === newFood.y
                );
            } while (isOnSnake);
            
            food = newFood;
        }

        // 移动蛇
        function moveSnake() {
            // 更新方向
            direction = nextDirection;
            
            // 创建新的蛇头
            const head = {...snake[0]};
            
            switch(direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }
            
            // 检查是否撞墙
            if (head.x < 0 || head.x >= config.boardSize || 
                head.y < 0 || head.y >= config.boardSize) {
                gameOver();
                return;
            }
            
            // 检查是否撞到自己
            if (snake.some(segment => 
                segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }
            
            // 添加新的蛇头
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分数
                score += 10;
                updateScore();
                
                // 生成新食物
                generateFood();
                
                // 播放吃到食物的音效（这里用视觉反馈代替）
                const foodCell = document.getElementById(`cell-${food.y * config.boardSize + food.x}`);
                if (foodCell) {
                    foodCell.style.transform = 'scale(1.3)';
                    setTimeout(() => {
                        foodCell.style.transform = 'scale(1)';
                    }, 200);
                }
            } else {
                // 如果没吃到食物，移除蛇尾
                snake.pop();
            }
            
            // 绘制更新
            drawSnake();
            drawFood();
        }

        // 更新分数
        function updateScore() {
            scoreElement.textContent = score;
            
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
        }

        // 游戏结束
        function gameOver() {
            clearInterval(gameInterval);
            isGameRunning = false;
            
            finalScoreElement.textContent = score;
            finalHighScoreElement.textContent = highScore;
            
            // 显示游戏结束画面
            setTimeout(() => {
                gameOverScreen.style.display = 'block';
            }, 500);
            
            // 更新按钮文本
            startBtn.textContent = '开始游戏';
        }

        // 开始游戏
        function startGame() {
            if (isGameRunning && !isPaused) return;
            
            if (!isGameRunning) {
                initGame();
                isGameRunning = true;
                startBtn.textContent = '重新开始';
            }
            
            if (isPaused) {
                isPaused = false;
                pauseBtn.textContent = '暂停游戏';
            }
            
            // 根据难度设置速度
            switch(difficultySelect.value) {
                case 'easy': currentSpeed = config.easySpeed; break;
                case 'medium': currentSpeed = config.mediumSpeed; break;
                case 'hard': currentSpeed = config.hardSpeed; break;
            }
            
            clearInterval(gameInterval);
            gameInterval = setInterval(moveSnake, currentSpeed);
            
            // 隐藏游戏结束画面
            gameOverScreen.style.display = 'none';
        }

        // 暂停/继续游戏
        function togglePause() {
            if (!isGameRunning) return;
            
            isPaused = !isPaused;
            
            if (isPaused) {
                clearInterval(gameInterval);
                pauseBtn.textContent = '继续游戏';
            } else {
                gameInterval = setInterval(moveSnake, currentSpeed);
                pauseBtn.textContent = '暂停游戏';
            }
        }

        // 重新开始游戏
        function restartGame() {
            clearInterval(gameInterval);
            isGameRunning = false;
            isPaused = false;
            startGame();
        }

        // 键盘控制
        function handleKeyDown(e) {
            if (!isGameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction !== 'down') nextDirection = 'up';
                    e.preventDefault();
                    break;
                    
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction !== 'up') nextDirection = 'down';
                    e.preventDefault();
                    break;
                    
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction !== 'right') nextDirection = 'left';
                    e.preventDefault();
                    break;
                    
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction !== 'left') nextDirection = 'right';
                    e.preventDefault();
                    break;
                    
                case ' ':
                    // 空格键暂停/继续
                    togglePause();
                    e.preventDefault();
                    break;
            }
        }

        // 移动设备控制
        function setupMobileControls() {
            document.getElementById('up-btn').addEventListener('click', () => {
                if (direction !== 'down') nextDirection = 'up';
            });
            
            document.getElementById('down-btn').addEventListener('click', () => {
                if (direction !== 'up') nextDirection = 'down';
            });
            
            document.getElementById('left-btn').addEventListener('click', () => {
                if (direction !== 'right') nextDirection = 'left';
            });
            
            document.getElementById('right-btn').addEventListener('click', () => {
                if (direction !== 'left') nextDirection = 'right';
            });
        }

        // 初始化
        function init() {
            initBoard();
            initGame();
            highScoreElement.textContent = highScore;
            
            // 事件监听器
            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            restartBtn.addEventListener('click', restartGame);
            playAgainBtn.addEventListener('click', restartGame);
            difficultySelect.addEventListener('change', () => {
                if (isGameRunning && !isPaused) {
                    clearInterval(gameInterval);
                    gameInterval = setInterval(moveSnake, currentSpeed);
                }
            });
            
            document.addEventListener('keydown', handleKeyDown);
            
            // 设置移动控制
            setupMobileControls();
            
            // 窗口大小改变时更新控制显示
            window.addEventListener('resize', () => {
                if (window.innerWidth <= 600 && isGameRunning) {
                    mobileControls.style.display = 'flex';
                } else {
                    mobileControls.style.display = 'none';
                }
            });
        }

        // 启动游戏
        window.onload = init;
    </script>
</body>
</html>
